server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Store and read timestamps in UTC regardless of the computer's time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Which provider handles each feature: ors or graphhopper (chosen separately for geocoding and routing)
geocoding.provider=${GEOCODING_PROVIDER:graphhopper}
routing.provider=${ROUTING_PROVIDER:graphhopper}
# Empty key defaults so the app still starts without them; routing and geocoding then return 502
ors.api-key=${ORS_API_KEY:}
ors.base-url=https://api.openrouteservice.org
graphhopper.api-key=${GRAPHHOPPER_API_KEY:}
graphhopper.base-url=https://graphhopper.com/api/1
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:3000}
talas.import-file=data/crimes.csv
